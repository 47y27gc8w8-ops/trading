# Paper-trading bots (src/brokers). One bot = one strategy variant from strategies/leaderboard.json,
# snapshotted 2026-11-27 so a leaderboard rebuild does not silently change a running bot.
# Selection: best variant per strategy with conservative (min of in-/out-of-sample) return >= 4.0%/yr
# (beats the ~4.15% T-bill yield), worst drawdown >= -60.0%, >= 10 backtest trades, not low-confidence.
# PAPER ONLY: no broker or exchange account exists; market data comes from public endpoints.
start_balance_chf: 10000
fee_pct: 0.10        # charged on every fill's notional
slippage_pct: 0.05   # adverse price move on every fill
bots:
  - id: eth-dip-inj
    strategy: eth_dip_ws
    profile: max-income
    variant_file: strategies/eth_dip_ws/symbols/INJUSDT/eth_dip_ws__INJUSDT__max-income__v002.md
    symbols: ["INJUSDT"]
    params: {"entry": 30, "exit": 40, "rsi_n": 24, "stop_loss_pct": 6}
    backtest: {conservative_yearly_pct: 36.76, worst_max_dd_pct: -22.86}
