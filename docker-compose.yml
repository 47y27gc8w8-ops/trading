x-base: &base
  build: .
  image: trading-pipeline:latest
  user: "1000:1000"          # files on ./data are owned by the host user
  environment:
    TZ: UTC
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  volumes:
    - ./data:/app/data
    - ./logs:/app/logs
    - ./config:/app/config:ro
    - ./src:/app/src:ro

services:
  binance-live:
    <<: *base
    command: python -m src.collectors.binance_live
    restart: unless-stopped
    stop_grace_period: 30s

  # Quote snapshots for every symbol in config/symbols.yaml every 30 s (Binance, Yahoo, CoinGecko).
  live-quotes:
    <<: *base
    command: python -m src.collectors.live_quotes
    environment:
      TZ: UTC
      POLL_SECONDS: "30"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:   # unhealthy if latest.json hasn't been rewritten for 2 minutes
      test: ["CMD", "python", "-c", "import os,time,sys; sys.exit(time.time()-os.path.getmtime('/app/data/quotes/latest.json')>120)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Every best bid/ask change for all coins (Binance bookTicker), rolling window, see config storage.
  binance-book:
    <<: *base
    command: python -m src.collectors.binance_book
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:   # unhealthy if no book file was written for 15 minutes
      test: ["CMD", "python", "-c", "import glob,os,time,sys; f=glob.glob('/app/data/crypto/book/date=*/*.parquet'); sys.exit(not f or time.time()-max(map(os.path.getmtime,f))>900)"]
      interval: 120s
      timeout: 60s
      retries: 3
      start_period: 600s

  dashboard:
    <<: *base
    command: uvicorn src.dashboard.app:app --host 0.0.0.0 --port 3000 --workers 1 --no-access-log
    ports:
      - "0.0.0.0:3000:3000"   # IPv4 only: LAN + Tailscale; not on the public IPv6 address (no login!)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/api/overview', timeout=20)"]
      interval: 60s
      timeout: 30s
      retries: 3

  # One-off / scheduled jobs: `docker compose run --rm <service>`
  binance-history:
    <<: *base
    command: python -m src.collectors.binance_history
    profiles: [jobs]

  binance-trades:
    <<: *base
    command: python -m src.collectors.binance_trades
    profiles: [jobs]

  storage:
    <<: *base
    command: python -m src.tools.storage report
    profiles: [jobs]

  yahoo-daily:
    <<: *base
    command: python -m src.collectors.yahoo_daily
    profiles: [jobs]

  yahoo-intraday:
    <<: *base
    command: python -m src.collectors.yahoo_intraday
    profiles: [jobs]

  check-data:
    <<: *base
    command: python -m src.tools.check_data
    profiles: [jobs]

  backtest:
    <<: *base
    command: python -m src.backtest.evolve --help
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
      - ./src:/app/src:ro
      - ./strategies:/app/strategies
    profiles: [jobs]
